<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="756" viewBox="0 0 1280 756" role="img" aria-label="Wait for completion, not a colour change">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75dcc0"/></marker></defs>
  <rect width="1280" height="756" fill="#101615"/>
  <g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="52" fill="#75dcc0" font-size="18" font-weight="650">ELKA NETWORK DIAGNOSTICS  /  QUICK GUIDE</text>
  <text x="48" y="105" fill="#f1f6f3" font-size="38" font-weight="700">Wait for completion, not a colour change</text><text x="48" y="146" fill="#b5c6be" font-size="24" font-weight="400">The first passing traffic results are not the end of a full scan.</text><rect x="48" y="190" width="556" height="325" rx="18" fill="#192321" stroke="#34443f"/><text x="78" y="238" fill="#f3c878" font-size="26" font-weight="700">STILL WORKING</text><text x="78" y="288" fill="#b5c6be" font-size="25" font-weight="400">A test or capture is running,</text><text x="78" y="323" fill="#b5c6be" font-size="25" font-weight="400">or a permission window needs you.</text><rect x="78" y="367" width="235" height="58" rx="12" fill="#303c37" stroke="#34443f"/><text x="98" y="405" fill="#8c9e94" font-size="24" font-weight="650">Run all checks</text><text x="78" y="468" fill="#f3c878" font-size="25" font-weight="600">Keep waiting. Check for prompts.</text><rect x="676" y="190" width="556" height="325" rx="18" fill="#192321" stroke="#34443f"/><text x="706" y="238" fill="#75dcc0" font-size="26" font-weight="700">READY FOR THE NEXT SCAN</text><text x="706" y="288" fill="#b5c6be" font-size="25" font-weight="400">Final recommendations are displayed.</text><text x="706" y="323" fill="#b5c6be" font-size="25" font-weight="400">The run buttons are available again.</text><rect x="706" y="367" width="235" height="58" rx="12" fill="#75dcc0" stroke="#75dcc0"/><text x="726" y="405" fill="#102d24" font-size="24" font-weight="650">Run all checks</text><text x="706" y="468" fill="#75dcc0" font-size="25" font-weight="600">Read the result, then continue.</text><rect x="48" y="553" width="1184" height="151" rx="18" fill="#102d24" stroke="#34443f"/><text x="78" y="603" fill="#f1f6f3" font-size="31" font-weight="650">Finished does not mean every result turns green.</text><text x="78" y="648" fill="#b5c6be" font-size="24" font-weight="400">Amber or red findings can remain. Read the status and recommendations;</text><text x="78" y="681" fill="#b5c6be" font-size="24" font-weight="400">a cancelled or incomplete scan needs review before you move on.</text>
  <text x="48" y="730" fill="#b5c6be" font-size="17" font-weight="400">Illustrated guide • Example data • Follow the matching labels in your app</text></g></svg>