<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="862" viewBox="0 0 1280 862" role="img" aria-label="One click checks BOTH PCs">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75dcc0"/></marker></defs>
  <rect width="1280" height="862" fill="#101615"/>
  <g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="52" fill="#75dcc0" font-size="18" font-weight="650">ELKA NETWORK DIAGNOSTICS  /  QUICK GUIDE</text>
  <text x="48" y="105" fill="#f1f6f3" font-size="38" font-weight="700">One click checks BOTH PCs</text><text x="48" y="146" fill="#b5c6be" font-size="24" font-weight="400">This quick check tests UDP and TCP in both directions.</text><rect x="48" y="184" width="520" height="238" rx="18" fill="#192321" stroke="#34443f"/><text x="78" y="226" fill="#75dcc0" font-size="28" font-weight="700">PC A</text><rect x="78" y="252" width="253" height="58" rx="12" fill="#75dcc0" stroke="#75dcc0"/><text x="98" y="290" fill="#102d24" font-size="24" font-weight="650">Check both PCs</text><circle cx="372" cy="281" r="23" fill="#75dcc0"/><text x="365" y="289" fill="#102d24" font-size="25" font-weight="700">1</text><text x="78" y="350" fill="#b5c6be" font-size="25" font-weight="400">Click ONCE on either paired PC.</text><text x="78" y="385" fill="#b5c6be" font-size="25" font-weight="400">You choose which PC starts.</text><rect x="712" y="184" width="520" height="238" rx="18" fill="#192321" stroke="#34443f"/><text x="742" y="226" fill="#75dcc0" font-size="28" font-weight="700">PC B</text><text x="742" y="282" fill="#f1f6f3" font-size="29" font-weight="650">Joins automatically</text><text x="742" y="340" fill="#b5c6be" font-size="24" font-weight="400">Keep this app open and paired.</text><text x="742" y="375" fill="#b5c6be" font-size="24" font-weight="400">No second click is needed.</text><path d="M589 286 L692 286" stroke="#75dcc0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="48" y="454" width="1184" height="311" rx="18" fill="#192321" stroke="#34443f"/><text x="78" y="500" fill="#f1f6f3" font-size="29" font-weight="650">Both screens show progress and the same four results</text><rect x="78" y="525" width="1124" height="46" rx="8" fill="#111b17" stroke="#34443f"/><text x="96" y="556" fill="#75dcc0" font-size="22" font-weight="650">UDP</text><text x="220" y="556" fill="#f1f6f3" font-size="23" font-weight="400">PC A → PC B</text><text x="630" y="556" fill="#f1f6f3" font-size="23" font-weight="400">200 / 200 verified</text><text x="1017" y="556" fill="#75dcc0" font-size="22" font-weight="400">Delivered</text><rect x="78" y="578" width="1124" height="46" rx="8" fill="#111b17" stroke="#34443f"/><text x="96" y="609" fill="#75dcc0" font-size="22" font-weight="650">UDP</text><text x="220" y="609" fill="#f1f6f3" font-size="23" font-weight="400">PC B → PC A</text><text x="630" y="609" fill="#f1f6f3" font-size="23" font-weight="400">200 / 200 verified</text><text x="1017" y="609" fill="#75dcc0" font-size="22" font-weight="400">Delivered</text><rect x="78" y="631" width="1124" height="46" rx="8" fill="#111b17" stroke="#34443f"/><text x="96" y="662" fill="#75dcc0" font-size="22" font-weight="650">TCP</text><text x="220" y="662" fill="#f1f6f3" font-size="23" font-weight="400">PC A → PC B</text><text x="630" y="662" fill="#f1f6f3" font-size="23" font-weight="400">200 / 200 verified</text><text x="1017" y="662" fill="#75dcc0" font-size="22" font-weight="400">Delivered</text><rect x="78" y="684" width="1124" height="46" rx="8" fill="#111b17" stroke="#34443f"/><text x="96" y="715" fill="#75dcc0" font-size="22" font-weight="650">TCP</text><text x="220" y="715" fill="#f1f6f3" font-size="23" font-weight="400">PC B → PC A</text><text x="630" y="715" fill="#f1f6f3" font-size="23" font-weight="400">200 / 200 verified</text><text x="1017" y="715" fill="#75dcc0" font-size="22" font-weight="400">Delivered</text><text x="48" y="812" fill="#b5c6be" font-size="24" font-weight="400">Example passing result. Read the next-step suggestion before a full scan.</text>
  <text x="48" y="836" fill="#b5c6be" font-size="17" font-weight="400">Illustrated guide • Example data • Follow the matching labels in your app</text></g></svg>