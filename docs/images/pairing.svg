  <g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="52" fill="#75dcc0" font-size="18" font-weight="650">ELKA NETWORK DIAGNOSTICS  /  QUICK GUIDE</text>
  <text x="48" y="105" fill="#f1f6f3" font-size="38" font-weight="700">Pair the two computers</text><text x="48" y="146" fill="#b5c6be" font-size="24" font-weight="400">Match the code and ports. The peer address is different on each PC.</text><rect x="48" y="184" width="556" height="462" rx="18" fill="#192321" stroke="#34443f"/><text x="78" y="227" fill="#75dcc0" font-size="30" font-weight="700">PC A</text><text x="78" y="268" fill="#b5c6be" font-size="19" font-weight="600">THIS PC — SELECT YOUR LAN ADAPTER</text><rect x="78" y="281" width="464" height="57" rx="10" fill="#111b17" stroke="#34443f"/><text x="96" y="319" fill="#f1f6f3" font-size="26" font-weight="600">192.168.1.20</text><text x="78" y="368" fill="#b5c6be" font-size="19" font-weight="600">PEER CONNECTION — ENTER THE OTHER PC</text><rect x="78" y="381" width="464" height="57" rx="10" fill="#111b17" stroke="#34443f"/><text x="96" y="419" fill="#f1f6f3" font-size="26" font-weight="600">192.168.1.30</text><text x="78" y="468" fill="#b5c6be" font-size="19" font-weight="600">PAIRING CODE — MATCH ON BOTH PCs</text><rect x="78" y="481" width="464" height="57" rx="10" fill="#111b17" stroke="#34443f"/><text x="96" y="519" fill="#f1f6f3" font-size="26" font-weight="600">The same complete code</text><rect x="78" y="563" width="225" height="58" rx="12" fill="#75dcc0" stroke="#75dcc0"/><text x="98" y="601" fill="#102d24" font-size="24" font-weight="650">Start endpoint</text><text x="331" y="600" fill="#75dcc0" font-size="22" font-weight="600">Click on BOTH</text><rect x="676" y="184" width="556" height="462" rx="18" fill="#192321" stroke="#34443f"/><text x="706" y="227" fill="#75dcc0" font-size="30" font-weight="700">PC B</text><text x="706" y="268" fill="#b5c6be" font-size="19" font-weight="600">THIS PC — SELECT YOUR LAN ADAPTER</text><rect x="706" y="281" width="464" height="57" rx="10" fill="#111b17" stroke="#34443f"/><text x="724" y="319" fill="#f1f6f3" font-size="26" font-weight="600">192.168.1.30</text><text x="706" y="368" fill="#b5c6be" font-size="19" font-weight="600">PEER CONNECTION — ENTER THE OTHER PC</text><rect x="706" y="381" width="464" height="57" rx="10" fill="#111b17" stroke="#34443f"/><text x="724" y="419" fill="#f1f6f3" font-size="26" font-weight="600">192.168.1.20</text><text x="706" y="468" fill="#b5c6be" font-size="19" font-weight="600">PAIRING CODE — MATCH ON BOTH PCs</text><rect x="706" y="481" width="464" height="57" rx="10" fill="#111b17" stroke="#34443f"/><text x="724" y="519" fill="#f1f6f3" font-size="26" font-weight="600">The same complete code</text><rect x="706" y="563" width="225" height="58" rx="12" fill="#75dcc0" stroke="#75dcc0"/><text x="726" y="601" fill="#102d24" font-size="24" font-weight="650">Start endpoint</text><text x="959" y="600" fill="#75dcc0" font-size="22" font-weight="600">Click on BOTH</text><rect x="48" y="678" width="1184" height="139" rx="18" fill="#102d24" stroke="#34443f"/><circle cx="84" cy="719" r="23" fill="#75dcc0"/><text x="77" y="727" fill="#102d24" font-size="25" font-weight="700">1</text><text x="120" y="728" fill="#f1f6f3" font-size="26" font-weight="600">Each PC enters the other PC’s address.</text><text x="78" y="775" fill="#b5c6be" font-size="25" font-weight="400">Copy one code to both PCs. Match ports: control 47830 • test 47831.</text>
  <text x="48" y="839" fill="#b5c6be" font-size="17" font-weight="400">Illustrated guide • Example data • Follow the matching labels in your app</text></g></svg>