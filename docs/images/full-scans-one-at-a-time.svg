<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1135" viewBox="0 0 1280 1135" role="img" aria-label="Full scans: ONE computer at a time">
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#75dcc0"/></marker></defs>
  <rect width="1280" height="1135" fill="#101615"/>
  <g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="52" fill="#75dcc0" font-size="18" font-weight="650">ELKA NETWORK DIAGNOSTICS  /  QUICK GUIDE</text>
  <text x="48" y="105" fill="#f1f6f3" font-size="38" font-weight="700">Full scans: ONE computer at a time</text><text x="48" y="146" fill="#b5c6be" font-size="24" font-weight="400">Each scan collects Windows evidence on the PC where you click.</text><rect x="48" y="177" width="1184" height="76" rx="18" fill="#352b1c" stroke="#735c32"/><text x="78" y="225" fill="#f3c878" font-size="29" font-weight="700">NEVER run “Run all checks” on both PCs at the same time.</text><circle cx="71" cy="300" r="23" fill="#75dcc0"/><text x="64" y="308" fill="#102d24" font-size="25" font-weight="700">1</text><text x="108" y="310" fill="#f1f6f3" font-size="28" font-weight="650">First: inspect the suggested PC (PC A in this example)</text><rect x="48" y="337" width="556" height="203" rx="18" fill="#192321" stroke="#34443f"/><text x="78" y="381" fill="#75dcc0" font-size="24" font-weight="700">PC A — YOU ARE HERE</text><rect x="78" y="405" width="235" height="58" rx="12" fill="#75dcc0" stroke="#75dcc0"/><text x="98" y="443" fill="#102d24" font-size="24" font-weight="650">Run all checks</text><text x="78" y="507" fill="#f1f6f3" font-size="24" font-weight="400">Stay here and answer permission prompts.</text><rect x="676" y="337" width="556" height="203" rx="18" fill="#192321" stroke="#34443f"/><text x="706" y="381" fill="#f3c878" font-size="24" font-weight="700">PC B — LEAVE IDLE</text><text x="706" y="427" fill="#b5c6be" font-size="24" font-weight="400">Keep Elka open and paired.</text><text x="706" y="462" fill="#b5c6be" font-size="24" font-weight="400">Do not start a scan, test or capture.</text><path d="M640 557 L640 592" stroke="#75dcc0" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="48" y="610" width="1184" height="117" rx="18" fill="#102d24" stroke="#34443f"/><text x="78" y="653" fill="#75dcc0" font-size="28" font-weight="700">WAIT for the full scan to finish</text><text x="78" y="694" fill="#f1f6f3" font-size="24" font-weight="400">Answer prompts. Wait for recommendations and available run buttons.</text><circle cx="71" cy="785" r="23" fill="#75dcc0"/><text x="64" y="793" fill="#102d24" font-size="25" font-weight="700">2</text><text x="108" y="795" fill="#f1f6f3" font-size="28" font-weight="650">Then: go to the OTHER PC and run its full scan</text><rect x="48" y="823" width="556" height="203" rx="18" fill="#192321" stroke="#34443f"/><text x="78" y="866" fill="#f3c878" font-size="24" font-weight="700">PC A — LEAVE IDLE</text><text x="78" y="913" fill="#b5c6be" font-size="24" font-weight="400">Keep Elka open and paired.</text><text x="78" y="948" fill="#b5c6be" font-size="24" font-weight="400">Do not start another test.</text><rect x="676" y="823" width="556" height="203" rx="18" fill="#192321" stroke="#34443f"/><text x="706" y="866" fill="#75dcc0" font-size="24" font-weight="700">PC B — YOU ARE HERE</text><rect x="706" y="890" width="235" height="58" rx="12" fill="#75dcc0" stroke="#75dcc0"/><text x="726" y="928" fill="#102d24" font-size="24" font-weight="650">Run all checks</text><text x="706" y="992" fill="#f1f6f3" font-size="24" font-weight="400">Stay here and answer its prompts.</text><text x="48" y="1082" fill="#b5c6be" font-size="25" font-weight="400">No address swap. No role change. Save a report from each PC.</text>
  <text x="48" y="1109" fill="#b5c6be" font-size="17" font-weight="400">Illustrated guide • Example data • Follow the matching labels in your app</text></g></svg>